<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youtube Premium</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="app">
    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <span class="logo-dot"></span>
          <span>Youtube Premium</span>
        </div>

        <nav class="nav">
          <a href="#" class="nav-item active" data-view="home">
            <i class="fa-solid fa-house"></i> Home
          </a>
          <a href="#" class="nav-item" data-view="popular">
            <i class="fa-solid fa-fire"></i> Popular
          </a>
          <a href="#" class="nav-item" data-view="categories">
            <i class="fa-solid fa-table-cells-large"></i> Categories
          </a>
          <a href="#" class="nav-item" data-view="favorites">
            <i class="fa-solid fa-heart"></i> Favorites
          </a>
          <a href="#" class="nav-item" data-view="playlist">
            <i class="fa-solid fa-list"></i> Playlist
          </a>
        </nav>

        <div class="subs-section">
          <div class="subs-title">PLAYLIST</div>
          <div id="sidebarPlaylist" class="subs-list"></div>
        </div>
      </div>

      <div class="premium-card">
        <h4>Your Playlist</h4>
        <p>Simpan video favorit dan buat playlist pribadi</p>
        <button id="openPlaylistBtn">Lihat Playlist</button>
      </div>
    </aside>

    <!-- ========== MAIN ========== -->
    <div class="main">
      <!-- Topbar -->
      <header class="topbar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search videos..." autocomplete="off" />
        </div>
        <div class="topbar-right">
          <button class="btn-outline" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
            <span>User</span>
          </div>
        </div>
      </header>

      <!-- Content -->
      <div class="content" id="content">
        <!-- Player View (hidden by default) -->
        <div id="playerView" class="player-view hidden">
          <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back</button>
          
          <div class="player-layout">
            <div class="player-main">
              <div class="player-wrapper">
                <div id="player"></div>
              </div>
              <div class="player-info">
                <h2 id="videoTitle">Title</h2>
                <div class="player-meta">
                  <span id="videoChannel">Channel</span>
                  <div class="player-actions">
                    <button id="favBtn" class="action-btn"><i class="fa-regular fa-heart"></i> Favorite</button>
                    <button id="addPlaylistBtn" class="action-btn"><i class="fa-solid fa-plus"></i> Playlist</button>
                  </div>
                </div>
              </div>

              <!-- Custom Controls -->
              <div class="controls">
                <button id="prevBtn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playPauseBtn" title="Play"><i class="fa-solid fa-play"></i></button>
                <button id="nextBtn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
                
                <div class="progress-wrap">
                  <span id="currentTime">0:00</span>
                  <input type="range" id="progress" value="0" min="0" max="100" step="0.1" />
                  <span id="duration">0:00</span>
                </div>

                <div class="volume-wrap">
                  <button id="muteBtn"><i class="fa-solid fa-volume-high"></i></button>
                  <input type="range" id="volume" value="100" min="0" max="100" />
                </div>

                <div class="quality-wrap">
                  <button id="qualityBtn" class="quality-btn" title="Quality">
                    <i class="fa-solid fa-gear"></i> <span id="qualityLabel">Auto</span>
                  </button>
                  <div id="qualityMenu" class="quality-menu hidden">
                    <button data-quality="highres">1080p+</button>
                    <button data-quality="hd1080">1080p</button>
                    <button data-quality="hd720">720p</button>
                    <button data-quality="large">480p</button>
                    <button data-quality="medium">360p</button>
                    <button data-quality="small">240p</button>
                    <button data-quality="tiny">144p</button>
                    <button data-quality="auto">Auto</button>
                  </div>
                </div>

                <button id="miniBtn" title="Mini Player"><i class="fa-solid fa-compress"></i></button>
                <button id="fsBtn" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
              </div>
            </div>

            <!-- Related / Playlist side -->
            <div class="side-queue">
              <h3>Up Next</h3>
              <div id="upNext" class="up-next-list"></div>
            </div>
          </div>
        </div>

        <!-- Home / Browse View -->
        <div id="browseView">
          <!-- Featured -->
          <section class="featured" id="featured">
            <!-- diisi via JS -->
          </section>

          <!-- Categories -->
          <section class="categories-section">
            <h3 class="section-title">Explore by categories</h3>
            <div class="category-pills" id="categoryPills">
              <button class="pill active" data-q="trending">Trending</button>
              <button class="pill" data-q="music">Music</button>
              <button class="pill" data-q="gaming">Gaming</button>
              <button class="pill" data-q="education">Education</button>
              <button class="pill" data-q="sports">Sports</button>
              <button class="pill" data-q="technology">Technology</button>
              <button class="pill" data-q="cooking">Cooking</button>
              <button class="pill" data-q="nature">Nature</button>
            </div>
          </section>

          <!-- Results / Videos -->
          <section class="videos-section">
            <h3 class="section-title" id="sectionTitle">Videos to try</h3>
            <div class="video-grid" id="results">
              <p class="empty-msg">Cari video atau pilih kategori di atas</p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>

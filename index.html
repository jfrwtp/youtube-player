<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom YouTube Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Playlist</h2>
        <button id="themeToggle" title="Ganti tema">☀️</button>
      </div>
      <ul id="playlist" class="side-list"></ul>

      <h2>Favorit</h2>
      <ul id="favorites" class="side-list"></ul>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="header">
        <input type="text" id="searchInput" placeholder="Cari video YouTube..." autocomplete="off" />
        <button id="searchBtn">Cari</button>
      </header>

      <!-- Player -->
      <div class="player-section">
        <div class="player-wrapper">
          <div id="player"></div>
        </div>

        <div class="now-playing">
          <h3 id="videoTitle">Pilih video untuk diputar</h3>
          <p id="videoChannel"></p>
        </div>

        <!-- Custom Controls -->
        <div class="controls">
          <button id="prevBtn" title="Previous">⏮</button>
          <button id="playPauseBtn" title="Play/Pause">▶</button>
          <button id="nextBtn" title="Next">⏭</button>

          <div class="progress-wrap">
            <span id="currentTime">0:00</span>
            <input type="range" id="progress" value="0" min="0" max="100" step="0.1" />
            <span id="duration">0:00</span>
          </div>

          <div class="volume-wrap">
            <button id="muteBtn" title="Mute">🔊</button>
            <input type="range" id="volume" value="100" min="0" max="100" />
          </div>

          <button id="favBtn" title="Favorit">♡</button>
          <button id="addPlaylistBtn" title="Tambah ke Playlist">＋ Playlist</button>
        </div>
      </div>

      <!-- Results -->
      <section class="results-section">
        <h2 class="section-title">Hasil Pencarian</h2>
        <div class="results" id="results">
          <p class="empty-msg">Ketik kata kunci lalu tekan Cari</p>
        </div>
      </section>
    </main>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
